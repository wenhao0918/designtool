[project]
name = "anvil"
version = "0.1.0"
description = "AI-powered mechanical design tool — AI is direct production power"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
anvil = "anvil.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.5",
    "bcrypt>=4.0",
]
