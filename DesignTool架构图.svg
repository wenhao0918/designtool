<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L11,5 L0,9.5 L3,5 z" fill="#475569"/>
    </marker>
    <marker id="arr-v" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L11,5 L0,9.5 L3,5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-r" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L11,5 L0,9.5 L3,5 z" fill="#e11d48"/>
    </marker>
    <marker id="arr-s" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L11,5 L0,9.5 L3,5 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1120" height="800" fill="#f1f5f9"/>
  <text x="560" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">DesignTool 架构图</text>
  <text x="560" y="46" text-anchor="middle" font-size="13" fill="#334155">范式：<tspan font-weight="bold" fill="#b45309">需求矩阵 Q →（Σ 驱动 · Π 分解+异构标注 · Δ 调度 · Ω 执行）→ 结果矩阵 S；指令 = ΔQ，Q′ = Q + ΔQ</tspan>，一切经 τ 工具面 —— 求解式设计</text>

  <!-- τ 工具面边界 -->
  <rect x="28" y="196" width="1076" height="452" rx="14" fill="rgba(255,255,255,0.55)" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="624" y="184" width="480" height="24" rx="12" fill="#475569"/>
  <text x="864" y="200" text-anchor="middle" font-size="12" fill="#fff">τ 工具面（内核边界）—— 一切交互的唯一通道 · 组件间不共享内存调用</text>

  <!-- 顶行：用户话 → Anvil -->
  <rect x="48" y="96" width="110" height="44" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="103" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">用户话</text>
  <line x1="158" y1="118" x2="192" y2="118" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="200" y="92" width="500" height="84" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="216" y="114" font-size="14" font-weight="bold" fill="#065f46">Anvil · 应用层（壳层翻译官）</text>
  <text x="330" y="130" font-size="11" fill="#047857">LLM 只是输入之一 · 只翻译不决策 · 欠定交设计者裁决（人在回路）</text>
  <text x="330" y="150" font-size="10.5" fill="#047857">持有：Φsrc 溯源 · <tspan font-weight="bold">Q 快照/加载</tspan>——回滚/分支（活账本仅一份）</text>
  <!-- Q 快照/加载 通道(虚线, 双向) -->
  <polyline points="284,170 284,266 280,266" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="4,3" marker-start="url(#arr-s)" marker-end="url(#arr)"/>
  <text x="294" y="252" text-anchor="middle" font-size="9.5" fill="#475569" transform="rotate(-90,294,252)">快照↑ ↓加载</text>
  <text x="1010" y="118" font-size="12" fill="#475569">持续补充 ▼</text>

  <!-- LLM 图标 -->
  <circle cx="655" cy="110" r="15" fill="#fff" stroke="#10b981" stroke-width="2"/>
  <text x="655" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">LLM</text>
  <text x="655" y="119" text-anchor="middle" font-size="7.5" fill="#047857">可换/路由</text>
  <!-- Q 快照叠图（Anvil 持有的副本序列） -->
  <rect x="230" y="142" width="34" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="240" y="136" width="34" height="34" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="250" y="130" width="34" height="34" rx="3" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="267" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Q</text>
  <text x="284" y="167" text-anchor="middle" font-size="8.5" fill="#64748b">快照序列</text>

  <!-- 知音：Anvil 调用的语义归一辅助工具（应用层，τ 边界之外） -->
  <line x1="740" y1="102" x2="672" y2="102" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-v)"/>
  <line x1="740" y1="118" x2="668" y2="118" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-v)"/>
  <text x="705" y="113" text-anchor="middle" font-size="9" fill="#6d28d9">调用/返回</text>
  <rect x="744" y="88" width="250" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="760" y="110" font-size="13" font-weight="bold" fill="#5b21b6">知音 · 语义归一层（辅助工具）</text>
  <text x="760" y="128" font-size="10.5" fill="#6d28d9">方言/俗称/行话 → 标准术语上下文</text>
  <text x="760" y="143" font-size="10.5" fill="#6d28d9">四级漏斗：词表→术语库→向量→图谱消歧</text>

  <!-- Anvil → R 写入路径（肘形） -->
  <line x1="240" y1="176" x2="240" y2="200" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="44" y="204" width="232" height="32" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">ΔQ 加法器（设计指令新增需求）</text>
  <text x="160" y="232" text-anchor="middle" font-size="9.5" fill="#1d4ed8">增 / 删 / 改 · 写入落账 · 溯源 Φsrc</text>
  <line x1="160" y1="236" x2="160" y2="246" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="172" y="245" font-size="10" font-weight="bold" fill="#1e40af">+ 落账：Q′ = Q + ΔQ</text>

  <!-- R 需求矩阵 -->
  <rect x="44" y="250" width="232" height="384" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="274" font-size="15" font-weight="bold" fill="#1e40af">Q 需求矩阵</text>
  <rect x="56" y="284" width="152" height="20" rx="5" fill="#dbeafe"/>
  <text x="63" y="298" font-size="11" fill="#1d4ed8">唯一写入者 = Anvil</text>
  <text x="60" y="322" font-size="12.5" fill="#1e3a8a">▪ 几何 I Θ F S B</text>
  <text x="60" y="344" font-size="12.5" fill="#1e3a8a">▪ 物理 M̂ L E</text>
  <text x="60" y="366" font-size="12.5" fill="#1e3a8a">▪ 运动 J ／ 工艺 Cₘ</text>
  <text x="60" y="388" font-size="12.5" fill="#1e3a8a">▪ 意图：固义/调义/权衡</text>
  <text x="60" y="410" font-size="12.5" fill="#1e3a8a">▪ 快照 ↔ Anvil</text>
  <text x="60" y="428" font-size="11" fill="#1e3a8a">（副本含 Φsrc·加载=回滚/分支）</text>
  <line x1="60" y1="544" x2="260" y2="544" stroke="#bfdbfe" stroke-dasharray="4,3"/>
  <text x="60" y="556" font-size="11" fill="#1e3a8a">不变量：同指令序列必得同 Q</text>
  <text x="60" y="574" font-size="11" fill="#1e3a8a">校验不过不落账</text>

  <!-- R → 内核 -->
  <line x1="276" y1="424" x2="302" y2="424" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="285" y="410" text-anchor="middle" font-size="10" fill="#475569">映射</text>

  <!-- 内核 -->
  <rect x="300" y="214" width="540" height="420" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="318" y="238" font-size="14" font-weight="bold" fill="#92400e">⊙ 内核（无 LLM · 无概率 · 可复算）</text>
  <text x="318" y="256" font-size="11" fill="#b45309">R 入 S 出，Σ 驱动，全程可追溯</text>
  <!-- VIOLATION 回路：判定不过 → 打回重译 / 转用户（原子回滚） -->
  <polyline points="650,214 650,178" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-r)"/>
  <text x="642" y="192" text-anchor="end" font-size="9.5" fill="#e11d48">VIOLATION/欠定 → 打回重译</text>
  <!-- 转用户分支：Anvil 只转述，裁决权在设计者 -->
  <polyline points="200,128 166,128" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-r)"/>
  <text x="181" y="143" text-anchor="middle" font-size="8" fill="#e11d48">转述·裁决</text>
  <!-- NPU 徽标（点缀：异构算力在内核之侧） -->
  <g>
    <line x1="766" y1="228" x2="772" y2="228" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="766" y1="234" x2="772" y2="234" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="766" y1="240" x2="772" y2="240" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="832" y1="228" x2="838" y2="228" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="832" y1="234" x2="838" y2="234" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="832" y1="240" x2="838" y2="240" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="772" y="221" width="60" height="26" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
    <rect x="780" y="227" width="44" height="14" rx="3" fill="none" stroke="#67e8f9" stroke-width="1.2"/>
    <text x="802" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0e7490">NPU</text>
  </g>

  <rect x="388" y="266" width="420" height="50" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="400" y="286" font-size="13" font-weight="bold" fill="#92400e">Σ 状态机 — 阶段控制</text>
  <text x="400" y="304" font-size="10.5" fill="#57534e">构思(意图收集)→建模→验证(约束验算)→完成(补齐+终验·定型)；转移条件可判定</text>
  <line x1="570" y1="316" x2="570" y2="340" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="582" y="332" font-size="10" fill="#475569">阶段触发</text>

  <rect x="388" y="344" width="420" height="96" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="366" font-size="13" font-weight="bold" fill="#92400e">Π 计算规划 — 算什么 / 依赖 DAG</text>
  <rect x="600" y="352" width="132" height="19" rx="9" fill="#fde68a"/>
  <text x="666" y="365" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#78350f">★ 核心：异构标注</text>
  <text x="400" y="386" font-size="11" fill="#57534e">▸ 依赖分解（拓扑序）· 逐任务标注 CPU|NPU（异构分工表规划期应用）</text>
  <text x="400" y="404" font-size="11" fill="#57534e">▸ 合批识别：同稀疏模式 → 批量 NPU 任务</text>
  <text x="400" y="422" font-size="11" fill="#57534e">▸ NPU 不可用 → 算力清单重规划为 CPU 版（降级=重规划）</text>
  <line x1="570" y1="440" x2="570" y2="464" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="582" y="456" font-size="10" fill="#475569">带算力标注的 DAG</text>

  <rect x="388" y="468" width="420" height="56" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="400" y="488" font-size="13" font-weight="bold" fill="#92400e">Δ 调度 — 何时算 / 怎么跑</text>
  <text x="400" y="506" font-size="11" fill="#57534e">依赖排队·合批投递·资源仲裁；失败只许重执行，不可恢复上报 Σ 重规划</text>
  <line x1="570" y1="524" x2="570" y2="548" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="582" y="540" font-size="10" fill="#475569">调度队列</text>

  <rect x="388" y="552" width="420" height="74" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="400" y="572" font-size="13" font-weight="bold" fill="#92400e">Ω 计算原语库 — 具体怎么算</text>
  <rect x="400" y="580" width="128" height="18" rx="7" fill="#fef3c7" stroke="#fde68a"/>
  <text x="464" y="593" text-anchor="middle" font-size="10.5" fill="#92400e">几何构造 · symbolic</text>
  <rect x="536" y="580" width="150" height="18" rx="7" fill="#fef3c7" stroke="#fde68a"/>
  <text x="611" y="593" text-anchor="middle" font-size="10.5" fill="#92400e">代数求解 · matrix · CPU</text>
  <rect x="694" y="580" width="112" height="18" rx="7" fill="#fef3c7" stroke="#fde68a"/>
  <text x="750" y="593" text-anchor="middle" font-size="10" fill="#92400e">校核/张量核 · NPU</text>
  <text x="400" y="616" font-size="11" fill="#57534e">统一身份=属性(data_form/exec_unit/domain)；复合原语=嵌套注册，与术语块对称</text>

  <!-- 𝒞 约束场：Primordium 之心（狭义约束，二值裁决权） -->
  <rect x="306" y="266" width="74" height="360" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="343" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#9f1239">C 约束场</text>
  <text x="343" y="299" text-anchor="middle" font-size="9" fill="#be123c">（Q 的映射）</text>
  <line x1="314" y1="306" x2="372" y2="306" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="343" y="330" text-anchor="middle" font-size="11.5" fill="#9f1239">P 硬律</text>
  <text x="343" y="354" text-anchor="middle" font-size="11.5" fill="#9f1239">M 可行</text>
  <text x="343" y="378" text-anchor="middle" font-size="11.5" fill="#9f1239">V 价值</text>
  <text x="343" y="406" text-anchor="middle" font-size="9.5" fill="#be123c">狭义约束</text>
  <text x="343" y="420" text-anchor="middle" font-size="9.5" fill="#be123c">可证伪·不可违逆</text>
  <text x="343" y="520" text-anchor="middle" font-size="11" font-weight="bold" fill="#9f1239" transform="rotate(-90,343,520)">二值裁决 PASS / VIOLATION</text>
  <text x="343" y="608" text-anchor="middle" font-size="9.5" fill="#be123c">任何算力与</text>
  <text x="343" y="621" text-anchor="middle" font-size="9.5" fill="#be123c">模型不得代行</text>

  <!-- 内核 → S -->
  <line x1="840" y1="424" x2="862" y2="424" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="851" y="410" text-anchor="middle" font-size="10" fill="#475569">落账</text>

  <!-- S 结果矩阵 -->
  <rect x="868" y="214" width="222" height="420" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="884" y="242" font-size="15" font-weight="bold" fill="#166534">S 结果矩阵</text>
  <rect x="880" y="252" width="142" height="20" rx="5" fill="#dcfce7"/>
  <text x="887" y="266" font-size="11" fill="#15803d">唯一写入者 = Ω</text>
  <text x="884" y="298" font-size="12.5" fill="#14532d">▪ X 位姿解（体×自由度）</text>
  <text x="884" y="320" font-size="12.5" fill="#14532d">▪ W 形状实例（CSG 记录）</text>
  <text x="884" y="342" font-size="12.5" fill="#14532d">▪ V 判定（PASS/VIOLATION）</text>
  <text x="884" y="364" font-size="12.5" fill="#14532d">▪ P 产物（STEP/STL·版本）</text>
  <line x1="884" y1="540" x2="1074" y2="540" stroke="#bbf7d0" stroke-dasharray="4,3"/>
  <text x="884" y="562" font-size="11" fill="#14532d">完整度可判定：</text>
  <text x="884" y="580" font-size="11" fill="#14532d">X 完整且 V 全 PASS = 解成立</text>
  <text x="884" y="610" font-size="11" fill="#14532d">三重下游：交付物 /</text>
  <text x="884" y="628" font-size="11" fill="#14532d">复用源（入库具名块）/ 演化基线</text>

  <!-- 底部三卡 -->
  <rect x="44" y="660" width="330" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="680" font-size="12" font-weight="bold" fill="#334155">交付 ▼（设计者主权）</text>
  <text x="58" y="698" font-size="11" fill="#475569">FreeCAD→STEP/STL 模型 · 回显确认 · 设计日志</text>
  <text x="58" y="713" font-size="11" fill="#475569">3D 查看 · 欠定自由度交设计者决策</text>

  <rect x="388" y="660" width="352" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="402" y="680" font-size="12" font-weight="bold" fill="#334155">复用 ↩</text>
  <text x="402" y="698" font-size="11" fill="#475569">成熟 S 经用户确认入库 = 具名块/标准件</text>
  <text x="402" y="713" font-size="11" fill="#475569">（"已知结构"矩阵块，回填下一个设计的 R）</text>

  <rect x="754" y="660" width="326" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="768" y="680" font-size="12" font-weight="bold" fill="#334155">演化 ↺</text>
  <text x="768" y="698" font-size="11" fill="#475569">设计修改 = R 微分 → 重解 → S 版本递进；</text>
  <text x="768" y="713" font-size="11" fill="#475569">S_edit 全程 Φsrc 可追溯</text>

  <!-- 图例 -->
  <g font-size="12" fill="#475569">
    <rect x="330" y="756" width="12" height="12" rx="2" fill="#2563eb"/><text x="348" y="766">数据对象 Q</text>
    <rect x="440" y="756" width="12" height="12" rx="2" fill="#d97706"/><text x="458" y="766">内核 Σ Π Δ Ω</text>
    <rect x="566" y="756" width="12" height="12" rx="2" fill="#16a34a"/><text x="584" y="766">数据对象 S</text>
    <rect x="680" y="756" width="12" height="12" rx="2" fill="#94a3b8"/><text x="698" y="766">τ 工具面（层边界）</text>
    <rect x="810" y="756" width="12" height="12" rx="2" fill="#10b981"/><text x="828" y="766">Anvil 应用层</text>
    <rect x="918" y="756" width="12" height="12" rx="2" fill="#8b5cf6"/><text x="936" y="766">知音 语义归一(辅助)</text>
  </g>
</svg>
